<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Punto de venta con Vue 3, Firebase y un backend seguro."
    />
    <title>Moda Urbana · Punto de venta</title>
    <style>
      #app-loading {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #475569;
      }
      #app-loading span {
        width: 2.5rem;
        height: 2.5rem;
        border: 4px solid #e2e8f0;
        border-top-color: #16a34a;
        border-radius: 9999px;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="h-full">
    <div id="app">
      <div id="app-loading"><span aria-label="Cargando aplicación"></span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
